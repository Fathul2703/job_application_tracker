targets:
  $default:
    builders:
      drift_dev:
        options:
          # ISO-8601 text keeps millisecond precision and the UTC marker.
          store_date_time_values_as_text: true
          # Used by `dart run drift_dev make-migrations`.
          databases:
            default: lib/data/database/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
