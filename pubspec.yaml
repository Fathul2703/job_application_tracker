name: job_application_tracker
description: "Job Tracker: a personal, local-first job application tracker for iOS and Android."
publish_to: 'none'

# build-name → versionName (Android) / CFBundleShortVersionString (iOS)
# build-number → versionCode (Android) / CFBundleVersion (iOS)
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: ^0.20.3
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  fonts:
    # Inter variable font (OFL, see assets/fonts/OFL.txt). One file covers
    # every weight via the wght axis.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
