name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Check generated code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- '*.g.dart'

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # The runner is UTC; re-run the date-heavy tests behind UTC so
      # time-zone assumptions (e.g. date-only values shifting a day) fail here.
      - name: Test in another time zone
        run: flutter test test/unit test/data
        env:
          TZ: America/Los_Angeles
